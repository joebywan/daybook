<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the page reach under the notch; the safe-area insets below put the
       board back inside it. Zoom is off because a pinch or double-tap zoom mid-puzzle is never
       what the player meant on a board that is itself driven by taps. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Daybook">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F6F1E7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11201C" media="(prefers-color-scheme: dark)">
  <title>Daybook</title>
  <meta name="description" content="A daily logic-puzzle app: new puzzles every day, no ads, no subscription. Works offline.">
  <!-- The app is served from a subpath, so its own files are relative. A link preview is fetched by a
       crawler that has no page to resolve against, so og:url and the image URLs are absolute. The
       domain root's /favicon.ico belongs to another site, so every icon is declared here rather than
       left to the browser's guess (relative to /daybook/, which is where the page always is). -->
  <link rel="canonical" href="https://knowhowit.com.au/daybook/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Daybook">
  <meta property="og:title" content="Daybook">
  <meta property="og:description" content="A daily logic-puzzle app: new puzzles every day, no ads, no subscription.">
  <meta property="og:url" content="https://knowhowit.com.au/daybook/">
  <meta property="og:image" content="https://knowhowit.com.au/daybook/social-preview.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Daybook: a sun rising over an open book, with the words 'A daily logic-puzzle app. New puzzles every day.'">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Daybook">
  <meta name="twitter:description" content="A daily logic-puzzle app: new puzzles every day, no ads, no subscription.">
  <meta name="twitter:image" content="https://knowhowit.com.au/daybook/social-preview.png">
  <meta name="twitter:image:alt" content="Daybook: a sun rising over an open book, with the words 'A daily logic-puzzle app. New puzzles every day.'">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Tab icons: the simplified mark (no rays) as SVG, with ICO/PNG for browsers that want them. -->
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" type="image/svg+xml" href="favicon.svg" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <style>
    :root { --bg: #F6F1E7; --fg: #41504B; }
    @media (prefers-color-scheme: dark) { :root { --bg: #11201C; --fg: #E6DECD; } }
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--fg);
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }
    #app {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      left: env(safe-area-inset-left, 0px);
      touch-action: none;
    }
    #app canvas { touch-action: none; outline: none; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px;
      align-items: center; justify-content: center;
      font: 15px -apple-system, system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div id="loading"><img src="favicon.svg" width="44" height="44" alt=""><span>Opening Daybook…</span></div>
  <div id="app"></div>
  <script src="daybook.js"></script>
  <script>
    // Offline after the first visit: see sw.js. The worker only starts controlling the page after
    // this load, so the page tells it everything it fetched — once at load, and once more when the
    // app has certainly finished loading its wasm, which is when stale files may be pruned.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(reg => {
          const send = prune => {
            const urls = performance.getEntriesByType('resource').map(e => e.name).concat([location.href]);
            if (reg.active) reg.active.postMessage({ type: 'cache-urls', urls, prune });
          };
          send(false);
          setTimeout(() => send(true), 6000);
        }).catch(() => {});
      });
    }
  </script>
</body>
</html>
