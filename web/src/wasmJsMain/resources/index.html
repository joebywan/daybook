<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the page reach under the notch; the safe-area insets below put the
       board back inside it. Zoom is off because a pinch or double-tap zoom mid-puzzle is never
       what the player meant on a board that is itself driven by taps. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kings">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F6F1E7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11201C" media="(prefers-color-scheme: dark)">
  <title>Daybook Kings</title>
  <style>
    :root { --bg: #F6F1E7; --fg: #41504B; }
    @media (prefers-color-scheme: dark) { :root { --bg: #11201C; --fg: #E6DECD; } }
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--fg);
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }
    #app {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      left: env(safe-area-inset-left, 0px);
      touch-action: none;
    }
    #app canvas { touch-action: none; outline: none; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font: 15px -apple-system, system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div id="loading">Setting out Kings…</div>
  <div id="app"></div>
  <script src="daybook.js"></script>
</body>
</html>
