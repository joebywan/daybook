name: Web parity
description: >
  Compare every board the built wasm distribution generates, in Chromium and WebKit, with the JVM's.
  The caller has already built web/build/dist/wasmJs/productionExecutable (./gradlew
  :web:wasmJsBrowserDistribution) with JDK 17 and the Android SDK set up. A year of every puzzle and
  tier (12,045 boards) takes about a minute in each browser; see tools/web-parity/check.py.

runs:
  using: composite
  steps:
    # The JVM's side: the same year, in the page's order. DAYBOOK_PARITY_DUMP is not an input Gradle
    # knows about, so without --rerun a restored build cache would skip the test and write no file.
    - name: JVM board dump
      shell: bash
      env:
        DAYBOOK_PARITY_DUMP: ${{ runner.temp }}/jvm-parity.txt
        DAYBOOK_PARITY_DAYS: '365'
      run: |
        ./gradlew :app:testDebugUnitTest --rerun --tests '*WebParityDumpTest*'
        test -s "$DAYBOOK_PARITY_DUMP" || { echo "::error::WebParityDumpTest wrote no dump"; exit 1; }

    # Keyed on the pinned Playwright version: the browsers, and the ~150 .debs their system packages
    # need, so a warm run downloads neither (the runners' apt mirror has served at 65 kB/s).
    - uses: actions/cache@v6
      with:
        path: |
          ~/.cache/ms-playwright
          ~/apt-archives
        key: playwright-apt-${{ runner.os }}-${{ hashFiles('tools/web-parity/requirements.txt') }}

    # apt is never time-killed: a killed install left dpkg half-configured and the retry failed at once.
    # Its downloads go to the cached folder, it waits for another apt's lock, and a failure is retried
    # once after `dpkg --configure -a`. The browser download can hang silently, so it gets ten minutes.
    - name: Install Playwright and its browsers
      shell: bash
      run: |
        python3 -m venv "$RUNNER_TEMP/pwenv"
        "$RUNNER_TEMP/pwenv/bin/pip" install --quiet -r tools/web-parity/requirements.txt
        mkdir -p ~/apt-archives/partial
        printf 'Dir::Cache::Archives "%s";\nDPkg::Lock::Timeout "300";\nAPT::Keep-Downloaded-Packages "true";\n' \
          ~/apt-archives | sudo tee /etc/apt/apt.conf.d/99daybook-cache >/dev/null
        pw="$RUNNER_TEMP/pwenv/bin/python -m playwright"
        $pw install-deps chromium webkit || { echo "::warning::install-deps failed; retrying once"; sudo dpkg --configure -a; $pw install-deps chromium webkit; }
        timeout 600 $pw install chromium webkit || { echo "::warning::browser download failed or hung; retrying once"; timeout 600 $pw install chromium webkit; }
        sudo chown -R "$USER" ~/apt-archives

    - name: Compare the browser's boards with the JVM's
      shell: bash
      run: >
        "$RUNNER_TEMP/pwenv/bin/python" tools/web-parity/check.py
        --jvm "$RUNNER_TEMP/jvm-parity.txt"
