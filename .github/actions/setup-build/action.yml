name: Set up the build
description: >
  JDK 17, the Android SDK and Gradle, as every workflow that runs ./gradlew needs them. web/ compiles files
  out of app/ and the build configures both projects, so a web-only build needs the Android SDK as well.
  The caller has checked out the repo. gradle/actions stays on v5 (CLAUDE.md, Settled).

runs:
  using: composite
  steps:
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: '17'

    - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        packages: 'platforms;android-37.0 build-tools;36.0.0'

    - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
