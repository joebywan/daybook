name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/renovate.yml'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04
    outputs:
      tag: v${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v5

      - name: Work out the version
        id: version
        run: |
          BASE="$(tr -d '[:space:]' < version.txt)"
          echo "name=${BASE}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./gradlew test

      - name: Restore the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Refusing to build a release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks" || { echo "::error::decoded keystore is empty"; exit 1; }

      # -PrequireSigning turns "no key, so quietly emit app-release-unsigned.apk" into a hard
      # failure. Without it a green build says nothing about whether the APK was signed.
      - name: Build signed release
        env:
          DAYBOOK_KEYSTORE: ${{ runner.temp }}/release.jks
          DAYBOOK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DAYBOOK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DAYBOOK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DAYBOOK_VERSION_CODE: ${{ steps.version.outputs.code }}
          DAYBOOK_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew assembleRelease -PrequireSigning=true

      # Play distributes bundles, not APKs, so both are built from the same signed inputs: the
      # APK is what gets sideloaded from the Release page, the AAB is what goes to Play.
      - name: Build signed bundle
        env:
          DAYBOOK_KEYSTORE: ${{ runner.temp }}/release.jks
          DAYBOOK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DAYBOOK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DAYBOOK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DAYBOOK_VERSION_CODE: ${{ steps.version.outputs.code }}
          DAYBOOK_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew bundleRelease -PrequireSigning=true

      - name: Verify the artifacts before publishing
        run: |
          ./tools/verify-apk.sh app/build/outputs/apk/release/app-release.apk
          ./tools/verify-aab.sh app/build/outputs/bundle/release/app-release.aab

      - name: Name the artifacts
        id: artifact
        run: |
          NAME="daybook-${{ steps.version.outputs.name }}"
          cp app/build/outputs/apk/release/app-release.apk "$NAME.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$NAME.aab"
          echo "apk=$NAME.apk" >> "$GITHUB_OUTPUT"
          echo "aab=$NAME.aab" >> "$GITHUB_OUTPUT"

      # --target: without it the tag lands on the branch head when the release is created, which is a
      # later commit whenever another merge arrived while this run was queued. The APK would then not
      # match its tag's source, and F-Droid's reproducible-build check (docs/fdroid/README.md) fails.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.name }}" \
            "${{ steps.artifact.outputs.apk }}" \
            "${{ steps.artifact.outputs.aab }}" \
            --title "Daybook ${{ steps.version.outputs.name }}" \
            --target "$GITHUB_SHA" \
            --generate-notes

      - name: Clean up the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  # Called directly rather than left to the `release: published` event: releases created with
  # GITHUB_TOKEN do not trigger other workflows.
  play:
    needs: release
    uses: ./.github/workflows/publish-play.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit

  fdroid:
    needs: release
    # A called workflow cannot hold more than its caller grants; this one starts pages.yml.
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/publish-fdroid.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
