name: Stats receiver

# The stats receiver in stats/ (docs/stats-reporting.md): a Cloudflare Worker and its D1 table. A pull request runs
# stats/check.sh against a local copy; a merge to main applies new migrations and deploys. Deploying needs the repo
# secrets CLOUDFLARE_API_TOKEN (Account: Workers Scripts Edit, D1 Edit, Account Settings Read) and
# CLOUDFLARE_ACCOUNT_ID, and a real database_id in stats/wrangler.jsonc; until then the deploy job says so and stops.
on:
  pull_request:
    paths:
      - 'stats/**'
      - '.github/workflows/stats.yml'
  push:
    branches: [main]
    paths:
      - 'stats/**'
      - '.github/workflows/stats.yml'
  workflow_dispatch:

concurrency:
  group: stats-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the receiver locally and check it
        run: stats/check.sh

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Apply migrations and deploy
        working-directory: stats
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || grep -q '"00000000-0000-0000-0000-000000000000"' wrangler.jsonc; then
            echo "::notice::Not deployed: set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets and the real database_id in stats/wrangler.jsonc."
            exit 0
          fi
          npx --yes wrangler@4.156.2 d1 migrations apply daybook-stats --remote
          npx --yes wrangler@4.156.2 deploy
