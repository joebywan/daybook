name: Stats receiver

# The stats receiver in stats/ (docs/stats-reporting.md): a Cloudflare Worker and its D1 table. A pull request runs
# stats/check.sh against a local copy; a merge to main applies new migrations and deploys. Deploying needs the repo
# secrets CLOUDFLARE_API_TOKEN (Account: Workers Scripts Write, D1 Write, Account Settings Read) and
# CLOUDFLARE_ACCOUNT_ID, and a workers.dev subdomain chosen once in the Cloudflare dashboard. The first deploy creates the
# D1 database. Without the secrets the deploy job says so and stops.
on:
  pull_request:
    paths:
      - 'stats/**'
      - '.github/workflows/stats.yml'
  push:
    branches: [main]
    paths:
      - 'stats/**'
      - '.github/workflows/stats.yml'
  workflow_dispatch:

concurrency:
  group: stats-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the receiver locally and check it
        run: stats/check.sh

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find or create the database, apply migrations, deploy, check it live
        working-directory: stats
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Not deployed: set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets."
            exit 0
          fi
          W="npx --yes wrangler@4.156.2"
          # The database is found by name, and made on the first deploy, so its id never has to be committed.
          id() { $W d1 list --json | python3 -c 'import json,sys; print(next((d["uuid"] for d in json.load(sys.stdin) if d["name"] == "daybook-stats"), ""))'; }
          db=$(id)
          if [ -z "$db" ]; then $W d1 create daybook-stats >/dev/null; db=$(id); fi
          [ -n "$db" ] || { echo "::error::Could not find or create the daybook-stats database"; exit 1; }
          sed -i "s/00000000-0000-0000-0000-000000000000/$db/" wrangler.jsonc
          $W d1 migrations apply daybook-stats --remote
          $W deploy

          # Prove the live path end to end: send a report from a fixed, fake install, check its row, then delete it.
          # The receiver answers 204 whatever happens, so only the row can say a report was stored.
          test_id=00000000-0000-4000-8000-000000000000
          url="https://daybook-stats.daybook-de6.workers.dev/report"
          today=$(date -u +%F)
          rows() { $W d1 execute daybook-stats --remote --json --command "SELECT COUNT(*) AS n FROM reports WHERE install = '$test_id'" | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["results"][0]["n"])'; }
          sleep 5 # let the new version settle
          curl -sf -o /dev/null -X POST -H 'Content-Type: application/json' "$url" --data-binary \
            "{\"schema\":1,\"install\":\"$test_id\",\"app\":\"deploy-check\",\"platform\":\"web\",\"sentOn\":\"$today\",\"firstPlayed\":null,\"sends\":1,\"puzzles\":[],\"days\":[]}"
          stored=$(rows)
          $W d1 execute daybook-stats --remote --command "DELETE FROM reports WHERE install = '$test_id'" >/dev/null
          left=$(rows)
          echo "deploy check: stored=$stored, left after delete=$left"
          [ "$stored" = 1 ] || { echo "::error::The live receiver did not store a valid report"; exit 1; }
          [ "$left" = 0 ] || { echo "::error::The deploy check's test row was not deleted"; exit 1; }
