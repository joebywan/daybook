name: Update screenshots

# Captures the screenshots on an emulator (tools/screenshots/capture.sh), attaches them to the run and,
# if they changed, opens a pull request with them. Merging it sends them to the Play listing
# (play-screenshots.yml), so they are looked at before Google reviews them. Manual only.
on:
  workflow_dispatch:
    inputs:
      readme:
        description: 'Open a pull request with the new docs/ images'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  capture:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-build

      - run: ./gradlew :app:assembleDebug

      # The emulator needs KVM, which hosted Linux runners offer after this udev rule.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - run: sudo apt-get install -y --no-install-recommends imagemagick   # the README copies are resized with it

      # google_apis, not google_apis_playstore: only the former lets capture.sh `adb root` to set the date.
      - name: Capture
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: tools/screenshots/capture.sh app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: |
            docs/play/screenshots/*.png
            docs/play/tablet-screenshots/*.png
            docs/screenshots/*.png

      - name: README pull request
        if: inputs.readme
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet -- docs fastlane && { echo "screenshots unchanged"; exit 0; }
          branch="docs/screenshots-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add docs fastlane
          git commit -m "Docs: recapture screenshots"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Docs: recapture screenshots" \
            --body "Recaptured by the Update screenshots workflow."
