name: Update screenshots

# Captures the screenshots on an emulator (tools/screenshots/capture.sh), attaches them to the run,
# and pushes them to the Play listing and, if they changed, a README pull request. Manual only: every
# Play listing change goes to Google review, so it should not ride on every merge.
on:
  workflow_dispatch:
    inputs:
      play:
        description: 'Upload to the Play listing'
        type: boolean
        default: true
      readme:
        description: 'Open a pull request with the new docs/ images'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v5

      - run: ./gradlew :app:assembleDebug

      # The emulator needs KVM, which hosted Linux runners offer after this udev rule.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - run: sudo apt-get install -y --no-install-recommends imagemagick   # the README copies are resized with it

      # google_apis, not google_apis_playstore: only the former lets capture.sh `adb root` to set the date.
      - name: Capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: tools/screenshots/capture.sh app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: docs/play/screenshots/*.png

      - name: Upload to Play
        if: inputs.play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install --quiet google-api-python-client google-auth
          python3 tools/screenshots/upload-play.py

      - name: README pull request
        if: inputs.readme
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet -- docs fastlane && { echo "screenshots unchanged"; exit 0; }
          branch="screenshots-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add docs fastlane
          git commit -m "Docs: recapture screenshots"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Docs: recapture screenshots" \
            --body "Recaptured by the Update screenshots workflow."
