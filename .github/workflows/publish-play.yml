name: Publish to Google Play

# Uploads a release's bundle to Play. A no-op until PLAY_SERVICE_ACCOUNT_JSON exists, so it can
# sit here safely before the Play Console side is set up.
#
# release.yml calls this directly via workflow_call rather than relying on the `release: published`
# event, because a release created with GITHUB_TOKEN does not trigger other workflows — so that
# event alone would never fire for our own automated releases. The event is still listed so that a
# release published by hand in the GitHub UI also reaches Play.
#
# The default track is `alpha`, which the Play Console calls "Closed testing - Alpha". The owner
# does not use internal testing (the GitHub APK and the web build cover quick checks), and a new
# personal developer account needs a closed test of 12 testers for 14 days before production access.
# Every release the pipeline builds is uploaded and rolled out to that track; once production access
# exists the default moves to `production`, with a staged rollout.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to upload'
        required: true
        type: string
      track:
        description: 'Play track'
        required: false
        type: string
        default: alpha
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload (defaults to the latest)'
        required: false
      track:
        description: 'Play track'
        required: false
        default: alpha
        type: choice
        options: [alpha, internal, beta, production]

concurrency:
  group: publish-play
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-26.04
    steps:
      # The secrets context is not usable in a job-level `if`, so the gate is a step.
      - name: Is Play configured?
        id: gate
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set — skipping the Play upload. See README, 'Publishing to Google Play'."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.configured == 'true'

      - name: Fetch the bundle from the release
        if: steps.gate.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          mkdir -p play
          # A manual run with no tag means the latest release: `gh` takes the latest when no tag is given.
          gh release download ${TAG:+"$TAG"} --repo "$GITHUB_REPOSITORY" --dir play --pattern '*.aab'
          ls -la play
          test -n "$(ls -1 play/*.aab 2>/dev/null)" || { echo "::error::no .aab on release $TAG"; exit 1; }

      - name: Upload to Play
        if: steps.gate.outputs.configured == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.joebywan.daybook
          releaseFiles: play/*.aab
          track: ${{ inputs.track || 'alpha' }}
          status: completed
