name: Publish to Google Play

# Uploads a release's bundle to Play. Fails if PLAY_SERVICE_ACCOUNT_JSON is missing.
#
# release.yml calls this directly via workflow_call rather than relying on the `release: published`
# event, because a release created with GITHUB_TOKEN does not trigger other workflows — so that
# event alone would never fire for our own automated releases. The event is still listed so that a
# release published by hand in the GitHub UI also reaches Play.
#
# The default track is `production`: Google granted production access in October 2026 after the
# closed test ("Closed testing - Alpha", which is `alpha` to the API). Each release goes to every
# user at once (`status: completed`) rather than a staged rollout, because a staged rollout needs
# someone to raise its percentage by hand and the owner wants releases hands-off; Google still
# reviews every update before anyone sees it. A manual run can still send a tag to `alpha`.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to upload'
        required: true
        type: string
      track:
        description: 'Play track'
        required: false
        type: string
        default: production
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload (defaults to the latest)'
        required: false
      track:
        description: 'Play track'
        required: false
        default: production
        type: choice
        options: [alpha, internal, beta, production]

concurrency:
  group: publish-play
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-26.04
    steps:
      # Play is live, so a missing key is a failed release, not a skipped one.
      - name: Is Play configured?
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$PLAY_JSON" || { echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not set; nothing was uploaded to Play."; exit 1; }

      - uses: actions/checkout@v7

      - name: Fetch the bundle from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          mkdir -p play
          # A manual run with no tag means the latest release: `gh` takes the latest when no tag is given.
          gh release download ${TAG:+"$TAG"} --repo "$GITHUB_REPOSITORY" --dir play --pattern '*.aab'
          ls -la play
          test -n "$(ls -1 play/*.aab 2>/dev/null)" || { echo "::error::no .aab on release $TAG"; exit 1; }

      - name: Upload to Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.joebywan.daybook
          releaseFiles: play/*.aab
          track: ${{ inputs.track || 'production' }}
          status: completed
