name: Play listing text

# Pushes the store text in fastlane/metadata/android/en-US/ (title, short and full description) to
# the Play listing whenever it changes on main. F-Droid reads the same files, so they are the one
# source for both stores. Every listing change goes to Google review.
on:
  push:
    branches: [main]
    paths:
      - 'fastlane/metadata/android/en-US/*.txt'
      - 'tools/play/upload-listing.py'
      - '.github/workflows/play-listing.yml'
  pull_request:
    paths:
      - 'fastlane/metadata/android/en-US/*.txt'
      - 'tools/play/upload-listing.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-listing
  cancel-in-progress: false

jobs:
  listing:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pull requests only check the limits, so a too-long description fails before it merges.
      - name: Check
        run: python3 tools/play/upload-listing.py --check

  # A job of its own so that only the upload, never a pull request's check, runs in the release environment.
  upload:
    needs: listing
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: release   # holds the Play service account
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Upload to Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not set; the listing was not uploaded."
            exit 1
          fi
          pip install --quiet google-api-python-client google-auth
          python3 tools/play/upload-listing.py
