name: Web

# Publishes the web build (web/) to GitHub Pages. Separate from Release so a web change never
# needs the signing secrets, and an Android release never waits on the wasm toolchain.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/renovate.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # web/ compiles files out of app/, and the build configures both projects.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v5

      - name: Build web distribution
        run: ./gradlew :web:wasmJsBrowserDistribution

      # Nothing ships that the browser generates differently from the JVM (and so from Android): a
      # failure here stops the deploy. The distribution built above is the one that is compared
      # and the one that is uploaded. About two minutes.
      - uses: ./.github/actions/web-parity

      # The source map is a megabyte and a half nobody on a phone needs.
      - name: Drop the source map
        run: rm -f web/build/dist/wasmJs/productionExecutable/*.map

      # Daybook's own F-Droid repo: publish-fdroid.yml keeps it on the `fdroid` branch, and republishes
      # the site after each release so this copy is current. No branch yet (first run) is fine.
      - uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: fdroid
          path: fdroid-branch
      - name: Add the F-Droid repo to the site
        run: |
          if [ -d fdroid-branch/repo ]; then
            mkdir -p web/build/dist/wasmJs/productionExecutable/fdroid
            cp -r fdroid-branch/repo web/build/dist/wasmJs/productionExecutable/fdroid/repo
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
