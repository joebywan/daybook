name: Web

# Publishes the web build (web/) to GitHub Pages. Separate from Release so a web change never
# needs the signing secrets, and an Android release never waits on the wasm toolchain.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/renovate.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # web/ compiles files out of app/, and the build configures both projects.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build web distribution
        run: ./gradlew :web:wasmJsBrowserDistribution

      # The source map is a megabyte and a half nobody on a phone needs.
      - name: Drop the source map
        run: rm -f web/build/dist/wasmJs/productionExecutable/*.map

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
