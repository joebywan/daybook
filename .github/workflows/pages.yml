name: Web

# Publishes the web build (web/) to GitHub Pages. Separate from Release so a web change never
# needs the signing secrets, and an Android release never waits on the wasm toolchain.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/renovate.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      # Full history and tags: the web badge is the release tag of this commit (tools/badges.py).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-build

      # Settings shows the release the build came from, as the badge does; without tags it falls back to version.txt.
      - name: Build web distribution
        run: |
          v=$(python3 tools/badges.py --web-version) && echo "web version: $v" || v=""
          DAYBOOK_WEB_VERSION="$v" ./gradlew :web:wasmJsBrowserDistribution

      # Nothing ships that the browser generates differently from the JVM (and so from Android): a
      # failure here stops the deploy. The distribution built above is the one that is compared
      # and the one that is uploaded. About two minutes.
      - uses: ./.github/actions/web-parity

      # The source map is a megabyte and a half nobody on a phone needs.
      - name: Drop the source map
        run: rm -f web/build/dist/wasmJs/productionExecutable/*.map

      # Daybook's own F-Droid repo: publish-fdroid.yml keeps it on the `fdroid` branch, and republishes
      # the site after each release so this copy is current. No branch yet (first run) is fine.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          persist-credentials: false
          ref: fdroid
          path: fdroid-branch
      - name: Add the F-Droid repo to the site
        run: |
          if [ -d fdroid-branch/repo ]; then
            mkdir -p web/build/dist/wasmJs/productionExecutable/fdroid
            cp -r fdroid-branch/repo web/build/dist/wasmJs/productionExecutable/fdroid/repo
          fi

      # The README's version badges (shields.io endpoints at badges/*.json): web, Play and our F-Droid repo.
      # A badge it cannot read says "unknown"; it never stops the deploy.
      - name: Add the version badges to the site
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install --quiet google-api-python-client google-auth || true
          python3 tools/badges.py web/build/dist/wasmJs/productionExecutable --fdroid fdroid-branch/repo

      # The player guide (tools/guide/): static pages at guide/ and guide/<puzzle id>. After web parity, which
      # has no need of them. sw.js leaves guide/ alone, so a page read never replaces the cached app.
      - name: Add the player guide to the site
        run: python3 tools/guide/build.py

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
