name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      statuses: write   # only used by the workflow_dispatch steps below
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Renovate's pull requests are made with GITHUB_TOKEN, which triggers no workflows, so
      # tools/dispatch-ci-for-renovate.sh runs this workflow by hand on their branches. The
      # check run a dispatched run produces is NOT counted by the pull request (its rollup stays
      # empty and the required `build` check stays unmet; shown by experiment), but a commit
      # status named `build` is. So a dispatched run reports itself as one. pull_request runs
      # need none of this: their check run counts.
      - name: Report pending (dispatched run)
        if: github.event_name == 'workflow_dispatch'
        run: >
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}"
          -f state=pending -f context=build -f description="Dispatched CI is running"
          -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the commit-message check below needs the pull request's whole range

      # CLAUDE.md forbids a `Co-Authored-By: Claude` trailer, and a rule written there lost to the
      # harness's own attribution reminder in session after session. `.claude/settings.json` now blocks
      # the commit at the tool, and this is the server-side backstop: `build` is a required check, so a
      # pull request carrying such a commit cannot merge, however it was made (`git commit -F` included).
      - name: No Claude attribution trailer in the commits
        if: github.event_name == 'pull_request'
        run: |
          RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          BAD="$(git log --format='%h %s' -i -E --grep='^co-authored-by:[[:space:]]*(claude|.*noreply@anthropic\.com)' "$RANGE")"
          if [ -n "$BAD" ]; then
            echo "::error::These commits carry a Co-Authored-By: Claude trailer, which CLAUDE.md forbids. Reword them (git rebase -i, then force-push your own branch) and push again."
            echo "$BAD"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew test

      # Deliberately assembleRelease, not assembleDebug. Building a different variant here from
      # the one that ships is how a broken release goes out repeatedly behind a green check.
      # Unsigned is fine: secrets are not exposed to pull requests from forks.
      - name: Build release variant
        run: ./gradlew assembleRelease

      # release.yml skips its own run of the tests when this exact source tree already passed here (the
      # usual case: a pull request merged onto the main it was tested against). Any other tree, such as
      # two pull requests merged side by side, is tested again before it ships.
      - name: Record the tree that passed
        run: git rev-parse 'HEAD^{tree}' > tested-tree.txt && echo "TREE=$(cat tested-tree.txt)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v5
        with:
          name: tested-tree-${{ env.TREE }}
          path: tested-tree.txt
          retention-days: 14

      - name: Report result (dispatched run)
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          RESULT: ${{ job.status }}
        run: |
          case "$RESULT" in
            success) state=success ;;
            cancelled) state=error ;;   # the dispatch script runs it again on error
            *) state=failure ;;
          esac
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$state" -f context=build -f description="Dispatched CI: $RESULT" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # Every board the browser generates must match the JVM's. A job here rather than a path-filtered workflow
  # so that it can be a required check: a required check from a workflow that never started blocks the merge,
  # so this job always runs and passes at once when nothing that could change a board was touched.
  web-parity:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      statuses: write   # only used by the workflow_dispatch steps below
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report pending (dispatched run)
        if: github.event_name == 'workflow_dispatch'
        run: >
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}"
          -f state=pending -f context=web-parity -f description="Dispatched CI is running"
          -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Could this change a board or the web build?
        id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${BASE:-$(git merge-base origin/main HEAD)}"
          if git diff --name-only "$base" HEAD | grep -qE '^(app/src/main/|app/src/test/java/com/joebywan/daybook/WebParityDumpTest\.kt$|web/|tools/web-parity/|\.github/actions/web-parity/|\.github/workflows/ci\.yml$|gradle/|gradle\.properties$)|\.gradle\.kts$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Nothing here can change a board or the web build; web parity not needed."
          fi

      - uses: actions/setup-java@v6
        if: steps.paths.outputs.run
        with:
          distribution: temurin
          java-version: '17'

      # web/ compiles files out of app/, and the build configures both projects.
      - uses: android-actions/setup-android@v4
        if: steps.paths.outputs.run
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v5
        if: steps.paths.outputs.run

      - name: Build web distribution
        if: steps.paths.outputs.run
        run: ./gradlew :web:wasmJsBrowserDistribution

      - uses: ./.github/actions/web-parity
        if: steps.paths.outputs.run

      - name: Report result (dispatched run)
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          RESULT: ${{ job.status }}
        run: |
          case "$RESULT" in
            success) state=success ;;
            cancelled) state=error ;;
            *) state=failure ;;
          esac
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$state" -f context=web-parity -f description="Dispatched CI: $RESULT" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
