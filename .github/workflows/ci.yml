name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read   # the attribution check reads the pull request's current body
      statuses: write   # only used by the workflow_dispatch steps below
    steps:
      # Renovate's pull requests are made with GITHUB_TOKEN, which triggers no workflows, so
      # tools/dispatch-ci-for-renovate.sh runs this workflow by hand on their branches. The
      # check run a dispatched run produces is NOT counted by the pull request (its rollup stays
      # empty and the required `build` check stays unmet; shown by experiment), but a commit
      # status named `build` is. So a dispatched run reports itself as one. pull_request runs
      # need none of this: their check run counts.
      - name: Report pending (dispatched run)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}   # on the status steps only: a job-level token would be readable by Gradle and every dependency
        run: >
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}"
          -f state=pending -f context=build -f description="Dispatched CI is running"
          -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the job's token can post statuses; keep it out of .git/config, where Gradle could read it
          fetch-depth: 0   # the commit-message check below needs the pull request's whole range

      # CLAUDE.md forbids Claude attribution anywhere (a Co-Authored-By trailer, a "Generated with
      # Claude Code" footer), and a rule written there lost to the harness's own reminders in session
      # after session. `.claude/settings.json` blocks it at the tool (tools/block-claude-attribution.sh),
      # and this is the server-side backstop with the same patterns: `build` is a required check, so a
      # pull request carrying it in a commit or its body cannot merge, however it was made. A body edited
      # later is checked by attribution.yml.
      - name: No Claude attribution in the commits or the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}   # this step only; reads the title and body as they are now, so a re-run after an edit sees the edit
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # A branch name is published too: no claude/ branches (the owner, 2026-11-13; a ruleset also refuses creating them).
          case "$HEAD_REF" in claude/*) echo "::error::Branch $HEAD_REF is named claude/..., which CLAUDE.md forbids. Push it under another name and reopen the pull request."; exit 1 ;; esac
          # attribution.yml strips a trailing footer the GitHub connector adds; give it a minute to land.
          for wait in 0 15 15 15 15; do
            sleep "$wait"
            PR="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}")"
            PR_TITLE="$(printf '%s' "$PR" | jq -r .title)"
            PR_BODY="$(printf '%s' "$PR" | jq -r '.body // ""')"
            printf '%s\n%s' "$PR_TITLE" "$PR_BODY" | grep -qiE -f tools/claude-attribution.pattern || break
          done
          RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          FAIL=0
          for c in $(git rev-list "$RANGE"); do
            if git log -1 --format=%B "$c" | grep -qiE -f tools/claude-attribution.pattern; then
              echo "::error::Commit $(git log -1 --format='%h %s' "$c") carries a Claude attribution, which CLAUDE.md forbids. Reword it and force-push your own branch."
              FAIL=1
            fi
          done
          if printf '%s\n%s' "$PR_TITLE" "$PR_BODY" | grep -qiE -f tools/claude-attribution.pattern; then
            echo "::error::The pull request's title or body carries a Claude attribution, which CLAUDE.md forbids. Edit it out, then re-run this job."
            FAIL=1
          fi
          exit $FAIL

      - uses: ./.github/actions/setup-build

      - name: Unit tests
        run: ./gradlew test

      # GuideTest checks the facts; this catches a page the builder refuses, which would otherwise first
      # fail in pages.yml after the merge and hold up the web deploy.
      - name: Build the player guide
        run: python3 tools/guide/build.py --out "$RUNNER_TEMP/guide"

      # Deliberately assembleRelease, not assembleDebug. Building a different variant here from
      # the one that ships is how a broken release goes out repeatedly behind a green check.
      # Unsigned is fine: secrets are not exposed to pull requests from forks.
      - name: Build release variant
        run: ./gradlew assembleRelease

      # release.yml skips its own run of the tests when this exact source tree already passed here (the
      # usual case: a pull request merged onto the main it was tested against). Any other tree, such as
      # two pull requests merged side by side, is tested again before it ships.
      - name: Record the tree that passed
        run: git rev-parse 'HEAD^{tree}' > tested-tree.txt && echo "TREE=$(cat tested-tree.txt)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-tree-${{ env.TREE }}
          path: tested-tree.txt
          retention-days: 14

      - name: Report result (dispatched run)
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          case "$RESULT" in
            success) state=success ;;
            cancelled) state=error ;;   # the dispatch script runs it again on error
            *) state=failure ;;
          esac
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$state" -f context=build -f description="Dispatched CI: $RESULT" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # Every board the browser generates must match the JVM's. A job here rather than a path-filtered workflow
  # so that it can be a required check: a required check from a workflow that never started blocks the merge,
  # so this job always runs and passes at once when nothing that could change a board was touched.
  web-parity:
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    permissions:
      contents: read
      statuses: write   # only used by the workflow_dispatch steps below
    steps:
      - name: Report pending (dispatched run)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}   # on the status steps only: a job-level token would be readable by Gradle and every dependency
        run: >
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}"
          -f state=pending -f context=web-parity -f description="Dispatched CI is running"
          -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Could this change a board or the web build?
        id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${BASE:-$(git merge-base origin/main HEAD)}"
          if git diff --name-only "$base" HEAD | grep -qE '^(app/src/main/|app/src/test/java/com/joebywan/daybook/WebParityDumpTest\.kt$|web/|tools/web-parity/|tools/render/render\.py$|\.github/actions/(web-parity|setup-build)/|\.github/workflows/ci\.yml$|gradle/|gradle\.properties$)|\.gradle\.kts$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Nothing here can change a board or the web build; web parity not needed."
          fi

      - uses: ./.github/actions/setup-build
        if: steps.paths.outputs.run

      - name: Build web distribution
        if: steps.paths.outputs.run
        run: ./gradlew :web:wasmJsBrowserDistribution

      - uses: ./.github/actions/web-parity
        if: steps.paths.outputs.run

      - name: Report result (dispatched run)
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          case "$RESULT" in
            success) state=success ;;
            cancelled) state=error ;;
            *) state=failure ;;
          esac
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$state" -f context=web-parity -f description="Dispatched CI: $RESULT" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
