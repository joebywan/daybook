name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write   # only used by the workflow_dispatch steps below
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Renovate's pull requests are made with GITHUB_TOKEN, which triggers no workflows, so
      # tools/dispatch-ci-for-renovate.sh runs this workflow by hand on their branches. The
      # check run a dispatched run produces is NOT counted by the pull request (its rollup stays
      # empty and the required `build` check stays unmet; shown by experiment), but a commit
      # status named `build` is. So a dispatched run reports itself as one. pull_request runs
      # need none of this: their check run counts.
      - name: Report pending (dispatched run)
        if: github.event_name == 'workflow_dispatch'
        run: >
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}"
          -f state=pending -f context=build -f description="Dispatched CI is running"
          -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew test

      # Deliberately assembleRelease, not assembleDebug. Building a different variant here from
      # the one that ships is how a broken release goes out repeatedly behind a green check.
      # Unsigned is fine: secrets are not exposed to pull requests from forks.
      - name: Build release variant
        run: ./gradlew assembleRelease

      - name: Report result (dispatched run)
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          RESULT: ${{ job.status }}
        run: |
          case "$RESULT" in
            success) state=success ;;
            cancelled) state=error ;;   # the dispatch script runs it again on error
            *) state=failure ;;
          esac
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$state" -f context=build -f description="Dispatched CI: $RESULT" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
