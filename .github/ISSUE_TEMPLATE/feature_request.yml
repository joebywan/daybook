name: Suggest something or give feedback
description: "An idea for Daybook (a puzzle, a setting, a change to how something works), or what you think of it."
labels: ["enhancement"]
type: Feature
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea or feedback
      description: What you'd like and what it would make better, or what you like, dislike or find too hard or too easy.
    validations:
      required: true
  - type: input
    id: puzzle
    attributes:
      label: Puzzle
      description: Which puzzle it's about, if any.
  - type: input
    id: version
    attributes:
      label: Daybook version
      description: From Settings, Help, Version (press and hold to copy). Optional.
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or sketch
      description: Optional. Drag it in here, or paste it.
