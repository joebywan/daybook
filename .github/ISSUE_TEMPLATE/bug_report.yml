name: Report a problem
description: Something in Daybook went wrong, looked wrong, or didn't work as you expected.
labels: ["bug"]
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        ## Update first, please

        Before you report anything, update Daybook to the
        [latest release](https://github.com/joebywan/daybook/releases/latest) and check the problem still happens.
        Most reports turn out to be something an update has already fixed, and a report against an old version
        can't be acted on.

        **On F-Droid?** The main f-droid.org repository builds every release itself, so it is often several
        days or more behind. If the version in the app is older than the latest release above, either add
        Daybook's own F-Droid repo, `https://knowhowit.com.au/daybook/fdroid/repo`, which gets each release as soon
        as it is made ([how](https://github.com/joebywan/daybook#f-droid)), or install the `.apk` from the
        latest release. Both use the same signing key, so they update in place and keep your streaks.

        **On the web?** Reload the page so you are on the newest version.

        Your version is in Daybook's Settings, under Help, in the "Version" row: press and hold it to copy,
        then paste it below.
  - type: checkboxes
    id: latest
    attributes:
      label: Latest version
      options:
        - label: I updated to the latest release and the problem still happens on it.
          required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen again
      description: The taps that lead to the problem, one per line. If it only happened once, say so.
      placeholder: |
        1. Open Sudoku, Hard, today's daily
        2. Tap a square, then the pencil
        3. Tap 5
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Daybook version
      description: From Settings, Help, Version (for example "Daybook 1.45.612 on Android 14 (Google Pixel 7)").
      placeholder: Daybook 1.45.612 on Android 14 (Google Pixel 7)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version, or browser
      description: For example "Galaxy S23, Android 14", or "Safari on an iPad" for the web version.
    validations:
      required: true
  - type: input
    id: puzzle
    attributes:
      label: Puzzle
      description: Which puzzle, if it was in one (for example Sudoku, Lexicon, Arrows).
  - type: dropdown
    id: tier
    attributes:
      label: Difficulty
      options:
        - Standard
        - Hard
        - Expert
        - Not in a puzzle
  - type: input
    id: board
    attributes:
      label: Which board?
      description: Daily (and its date), Random, a Level and its number, or Training.
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: A screenshot (or a short screen recording) helps a lot. Drag it in here, or paste it.
